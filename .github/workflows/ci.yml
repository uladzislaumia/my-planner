name: CI

on:
  push:
    branches: [main]
    # Docs, screenshots and IDE settings don't affect the build
    paths-ignore: &docs-only
      - '**.md'
      - 'docs/**'
      - '.idea/**'
      - '.git-blame-ignore-revs'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew :app:detekt

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/
          retention-days: 14

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

  build:
    name: Build debug APK
    # Only build once static analysis and tests have passed
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
