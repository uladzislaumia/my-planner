complexity:
  active: true
  ComplexCondition:
    active: true
    allowedConditions: 4
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 15
  LongMethod:
    active: true
    allowedLines: 60
    # Compose UI functions are layout declarations and naturally long
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 30

naming:
  active: true
  ClassNaming:
    active: true
  FunctionNaming:
    active: true
    # Composable functions are PascalCase by Compose conventions
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: true

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    # Early returns at the top of a function (guard clauses) keep it flat and readable
    excludeGuardClauses: true
